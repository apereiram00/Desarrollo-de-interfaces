<ion-header>
  <ion-toolbar>
    <ion-title>Agregar Contacto</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="addContact()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="newContact.name" name="name" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input [(ngModel)]="newContact.email" name="email" type="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input [(ngModel)]="newContact.phone" name="phone" type="tel" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Categoría</ion-label>
      <ion-select [(ngModel)]="newContact.category" name="category">
        <ion-select-option value="Amigos">Amigos</ion-select-option>
        <ion-select-option value="Familia">Familia</ion-select-option>
        <ion-select-option value="Trabajo">Trabajo</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Notas</ion-label>
      <ion-textarea [(ngModel)]="newContact.notes" name="notes"></ion-textarea>
    </ion-item>

    <ion-button expand="full" type="submit" color="primary">Guardar</ion-button>
  </form>
</ion-content>
